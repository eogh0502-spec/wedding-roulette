<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>축의금 룰렛</title>
<style>
:root{--bg:#fff0f3;--fg:#3a1f2b;--card:#ffffff;--btn:#d6336c;--btn-fg:#fff;--muted:#7a6a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--fg:#fbeed6;--card:#2a2119;--btn:#ff4d47;--btn-fg:#fff;--muted:#b8a78f}}
:root[data-theme="dark"]{--bg:#1a1410;--fg:#fbeed6;--card:#2a2119;--btn:#ff4d47;--btn-fg:#fff;--muted:#b8a78f}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:18px}
h1{margin:0;font-size:1.6rem}
p.sub{margin:0;color:var(--muted);font-size:.95rem}
.wrap{position:relative;width:min(88vw,420px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
button{font:inherit;font-weight:700;font-size:1.2rem;padding:14px 40px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-fg);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.6;cursor:default}
#result{min-height:2.4em;font-size:1.5rem;font-weight:800;text-align:center}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
</style>
</head>
<body>
<h1 id="ttl">💍 축의금 룰렛</h1>
<p class="sub">오늘의 축의금은 과연? · 1인 1회</p>
<div class="wrap"><div class="pointer"></div><canvas id="c"></canvas></div>
<button id="spin">돌리기!</button>
<div id="result"></div>
<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
<script>
const items=[{t:"꽝",c:"#6b7280"},{t:"10만원",c:"#2f80ed"},{t:"500만원",c:"#f2b01e"}];
const N=items.length,SEG=360/N;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let size=0,theta=0,spinning=false,lastTick=-1,audio;
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;size=r.width;cv.width=size*d;cv.height=size*d;ctx.setTransform(d,0,0,d,0,0);draw();}
function draw(){const s=size,cx=s/2,R=s/2-8;ctx.clearRect(0,0,s,s);ctx.save();ctx.translate(cx,cx);ctx.rotate(theta*Math.PI/180);for(let i=0;i<N;i++){const a0=(i*SEG-90)*Math.PI/180,a1=((i+1)*SEG-90)*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,a1);ctx.closePath();ctx.fillStyle=items[i].c;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#fff";ctx.stroke();ctx.save();ctx.rotate((a0+a1)/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="800 "+(s*0.075)+"px sans-serif";ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=4;ctx.fillText(items[i].t,R-s*0.06,s*0.026);ctx.restore();}ctx.restore();ctx.beginPath();ctx.arc(cx,cx,R,0,7);ctx.lineWidth=8;ctx.strokeStyle="#3b2a14";ctx.stroke();ctx.beginPath();ctx.arc(cx,cx,s*0.06,0,7);ctx.fillStyle="#3b2a14";ctx.fill();}
function beep(f,d,v){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type="square";g.gain.value=v||.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d);}catch(e){}}
const ease=t=>1-Math.pow(1-t,5);
function spin(){if(spinning||hasSpun())return;spinning=true;const btn=document.getElementById("spin"),res=document.getElementById("result");btn.disabled=true;res.textContent="";const edge=Math.random()<.5?240+1.5:360-1.5;const start=theta%360,target=360*7-edge,total=target-start,t0=performance.now(),dur=8500,from=start;function step(now){const p=Math.min(1,(now-t0)/dur);theta=from+total*ease(p);const idx=Math.floor(theta/(SEG/2));if(idx!==lastTick){lastTick=idx;beep(900,.05);}draw();if(p<1)requestAnimationFrame(step);else finish();}requestAnimationFrame(step);}
function finish(){spinning=false;markSpun();lockBtn();document.getElementById("result").textContent="💐 축의금 500만원!! 감사합니다 💐";[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,.08),i*130));confetti();}
function confetti(){const c=document.getElementById("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#f2b01e","#e5322d","#2f80ed","#2ecc71","#ff7ab8"];const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<180)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();}
const KEY="wedding-roulette-done";
function hasSpun(){try{return localStorage.getItem(KEY)==="1"}catch(e){return false}}
function markSpun(){try{localStorage.setItem(KEY,"1")}catch(e){}}
function lockBtn(){const b=document.getElementById("spin");b.disabled=true;b.textContent="참여 완료 💌"}
if(hasSpun()){lockBtn();document.getElementById("result").textContent="이미 참여하셨어요 😊"}
let taps=0;document.getElementById("ttl").addEventListener("click",()=>{if(++taps>=5){taps=0;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}});
document.getElementById("spin").addEventListener("click",spin);
addEventListener("resize",resize);resize();
</script>
</body>
</html>
